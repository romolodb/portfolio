<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dentro il Libro — Galleria 360°</title>

  <!-- ============================================================
       DENTRO IL LIBRO — Galleria circolare per Meta Quest 3
       ------------------------------------------------------------
       Le opere sono distribuite in modo EQUIDISTANTE lungo i 360°
       attorno al visitatore, ciascuna col proprio titolo sotto.
       Il cerchio ruota lentamente.

       Pizzicando un'opera, questa NON viene spostata: ne compare
       una copia ingrandita su una "vetrina" che si posiziona
       sempre perfettamente frontale davanti all'osservatore,
       con titolo e descrizione sotto. Le opere del cerchio non
       vengono mai mosse ne' ruotate, quindi non possono restare
       storte al ritorno.

       COME AGGIUNGERE LE TUE IMMAGINI:
       modifica l'array IMAGES qui sotto (src, title, caption).
       Le proporzioni di ogni immagine sono rispettate
       automaticamente.

       INTERAZIONE:
       - VISORE (mani):       guarda un'opera e pizzica (pollice +
                              indice, mano qualsiasi). Un altro
                              pizzico chiude la vetrina.
       - VISORE (controller): punta col laser e premi il grilletto
       - DESKTOP:             click del mouse sull'opera;
                              frecce sinistra/destra ruotano;
                              Esc chiude; Invio simula il pinch
       ============================================================ -->

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <style>
    :root{
      --ink:#101418; --paper:#f5f2ec; --accent:#c8a24a; --muted:#8a8578;
    }
    html,body{margin:0;height:100%;background:var(--ink);}
    #splash{
      position:fixed; inset:0; z-index:9999;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:radial-gradient(ellipse at 50% 30%, #1c2229 0%, #0c0f13 70%);
      color:var(--paper); font-family:Georgia,'Times New Roman',serif;
      text-align:center; padding:24px; gap:14px;
    }
    #splash .eyebrow{
      font-family:ui-monospace,Menlo,monospace; font-size:11px; letter-spacing:.35em;
      text-transform:uppercase; color:var(--accent);
    }
    #splash h1{font-size:clamp(28px,6vw,52px); font-weight:400; margin:0; letter-spacing:.02em;}
    #splash p{max-width:34em; line-height:1.6; color:#cfc9bb; font-size:15px; margin:0;}
    #enter{
      margin-top:18px; padding:14px 42px; font-size:16px; letter-spacing:.12em;
      font-family:ui-monospace,Menlo,monospace; text-transform:uppercase;
      background:transparent; color:var(--paper); border:1px solid var(--accent);
      border-radius:999px; cursor:pointer; transition:background .25s,color .25s;
    }
    #enter:hover,#enter:focus-visible{background:var(--accent); color:var(--ink); outline:none;}
    #hint{font-size:12px; color:var(--muted); font-family:ui-monospace,Menlo,monospace;}
  </style>
</head>
<body>

  <!-- ================= CONFIGURAZIONE GALLERIA ================= -->
  <script>
  const EXHIBIT = { title: "Dentro il Libro" };

  const IMAGES = [
    { src: "img1.png", title: "Immagine 1", caption: "Descrizione dell'immagine" },
    { src: "img2.png", title: "Immagine 2", caption: "Descrizione dell'immagine" },
    { src: "img3.png", title: "Immagine 3", caption: "Descrizione dell'immagine" },
    // Aggiungi qui le altre opere:
    // { src: "img4.png", title: "Immagine 4", caption: "..." },
  ];

  // --- Parametri della sala (modificabili) ---
  const RING_RADIUS    = 3.4;   // distanza delle opere dal visitatore (metri)
  const EYE_LEVEL      = 1.6;   // quota del centro delle opere
  const IMG_HEIGHT_MAX = 1.30;  // altezza massima di un'opera nel cerchio
  const IMG_HEIGHT_MIN = 0.40;  // altezza minima (con moltissime opere)
  const GAP_MIN_DEG    = 2;     // respiro minimo fra due opere adiacenti (gradi)
  const SPIN_SPEED     = 0;     // rotazione continua del cerchio (gradi/secondo)
  const TITLE_GAP      = 0.14;  // distanza del titolo dal bordo dell'opera
  const DIM_OPACITY    = 0.18;  // quanto si attenua il cerchio con la vetrina aperta

  // --- Vetrina: l'opera portata in primo piano ---
  const DISPLAY_DIST   = 2.2;   // distanza dall'osservatore (metri)
  const DISPLAY_HEIGHT = 1.7;   // altezza dell'opera in primo piano
  const DISPLAY_MAX_W  = 2.8;   // larghezza massima (per immagini panoramiche)
  </script>
  <!-- =========================================================== -->

  <div id="splash">
    <span class="eyebrow">Galleria immersiva</span>
    <h1 id="splash-title">Dentro il Libro</h1>
    <p>Le opere ti circondano, ciascuna col suo titolo. Guardane una e unisci
       pollice e indice: si presenta davanti a te, ingrandita e con la sua
       descrizione. Ripeti il gesto per tornare alla sala.</p>
    <button id="enter">Inizia</button>
    <span id="hint">Meta Quest 3 · hand tracking · click col mouse per provare da desktop</span>
  </div>

  <a-scene
    id="scene"
    background="color: #0c0f13"
    webxr="optionalFeatures: hand-tracking"
    renderer="colorManagement: true; antialias: true"
    vr-mode-ui="enabled: false"
    loading-screen="enabled: false">

    <!-- Pavimento della sala -->
    <a-circle position="0 0.01 0" rotation="-90 0 0" radius="9"
      color="#14181d" material="shader: flat"></a-circle>
    <a-ring position="0 0.02 0" rotation="-90 0 0"
      radius-inner="3.28" radius-outer="3.35"
      color="#c8a24a" material="shader: flat; opacity: 0.20; transparent: true"></a-ring>

    <!-- Carosello: le opere vengono create qui via JavaScript -->
    <a-entity id="ring"></a-entity>

    <!-- Vetrina: contenitore vuoto. Il suo contenuto viene ricreato ad ogni
         apertura, cosi' ogni immagine ha un materiale nuovo e non puo' esserci
         alcun residuo della texture precedente. -->
    <a-entity id="display" visible="false"></a-entity>

    <!-- Rig: camera + mani + controller -->
    <a-entity id="rig" position="0 0 0">
      <a-entity id="camera" camera position="0 1.6 0" look-controls></a-entity>
      <a-entity id="handL" hand-tracking-controls="hand: left; modelColor: #d9d2c2"></a-entity>
      <a-entity id="handR" hand-tracking-controls="hand: right; modelColor: #d9d2c2"></a-entity>
      <a-entity laser-controls="hand: left"  raycaster="objects: .artwork, .closer" line="color: #c8a24a; opacity: 0.6"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .artwork, .closer" line="color: #c8a24a; opacity: 0.6"></a-entity>
    </a-entity>

    <!-- Cursore mouse per il test da desktop -->
    <a-entity cursor="rayOrigin: mouse" raycaster="objects: .artwork, .closer"></a-entity>
  </a-scene>

  <script>
  (function () {
    const $ = (id) => document.getElementById(id);
    const scene = $("scene");
    const THREE_ = AFRAME.THREE;
    const DEG = 180 / Math.PI;

    document.getElementById("splash-title").textContent = EXHIBIT.title;
    document.title = EXHIBIT.title + " — Galleria 360°";

    let spinning = true;
    let selected = null;     // record dell'opera in vetrina
    const arts = [];         // record: { root, img, frame, titleEl, aspect, item }

    // Le proporzioni servono per il layout: le leggo subito, in parallelo.
    const aspectsReady = Promise.all(IMAGES.map(item => new Promise(resolve => {
      const im = new Image();
      im.onload  = () => resolve(im.naturalWidth / im.naturalHeight);
      im.onerror = () => resolve(1.4);      // fallback se un file manca
      im.src = item.src;
    })));

    // ---------- Rotazione continua del carosello ----------
    AFRAME.registerComponent("carousel-spin", {
      tick: function (t, dt) {
        if (!spinning || !dt) return;
        this.el.object3D.rotation.y += THREE_.MathUtils.degToRad(SPIN_SPEED * dt / 1000);
      }
    });
    $("ring").setAttribute("carousel-spin", "");

    // Libera davvero la texture dalla memoria GPU prima di sostituirla:
    // senza questo, un'immagine di dimensioni diverse verrebbe copiata
    // DENTRO la precedente, lasciandola visibile attorno.
    function clearTexture(el) {
      const mesh = el.getObject3D && el.getObject3D("mesh");
      if (mesh && mesh.material && mesh.material.map) {
        mesh.material.map.dispose();
        mesh.material.map = null;
        mesh.material.needsUpdate = true;
      }
    }

    // ---------- Layout: opere equidistanti sui 360° ----------
    // Ogni opera ha uno "spicchio" di 360/n gradi. L'altezza comune viene
    // scelta perche' anche l'immagine piu' larga stia nel suo spicchio.
    function solveHeight(aspects) {
      const slot = 360 / aspects.length - GAP_MIN_DEG;
      if (slot <= 1) return IMG_HEIGHT_MIN;
      const wMax = 2 * RING_RADIUS * Math.tan((slot / 2) / DEG);
      const h = wMax / Math.max.apply(null, aspects);
      return Math.min(IMG_HEIGHT_MAX, Math.max(IMG_HEIGHT_MIN, h));
    }

    async function buildRing() {
      const aspects = await aspectsReady;
      const ring = $("ring");
      const h = solveHeight(aspects);
      const step = 360 / IMAGES.length;      // passo angolare costante = disposizione equa

      IMAGES.forEach((item, i) => {
        const ang = step * i;                // 0°, 120°, 240° ... sempre equidistanti
        const rad = ang / DEG;
        const x = RING_RADIUS * Math.sin(rad);
        const z = -RING_RADIUS * Math.cos(rad);
        const w = h * aspects[i];

        // Contenitore: posizione e orientamento verso il centro. Non viene MAI
        // ne' spostato ne' ruotato dopo la creazione.
        const root = document.createElement("a-entity");
        root.setAttribute("position", `${x} ${EYE_LEVEL} ${z}`);
        root.setAttribute("rotation", `0 ${-ang} 0`);

        const img = document.createElement("a-plane");
        img.classList.add("artwork");
        img.setAttribute("width", w);
        img.setAttribute("height", h);
        img.setAttribute("material",
          `src: ${item.src}; shader: flat; side: double; transparent: true; opacity: 1`);

        const frame = document.createElement("a-plane");
        frame.setAttribute("width", w + 0.05);
        frame.setAttribute("height", h + 0.05);
        frame.setAttribute("position", "0 0 -0.004");
        frame.setAttribute("material",
          "color: #1c2229; shader: flat; side: double; transparent: true; opacity: 1");
        img.appendChild(frame);

        // Titolo: sempre visibile sotto l'opera
        const titleEl = document.createElement("a-text");
        titleEl.setAttribute("value", item.title || "");
        titleEl.setAttribute("align", "center");
        titleEl.setAttribute("color", "#8a8578");
        titleEl.setAttribute("width", Math.max(w * 0.95, 0.8));
        titleEl.setAttribute("wrap-count", 26);
        titleEl.setAttribute("position", `0 ${-(h / 2 + TITLE_GAP)} 0.01`);

        root.appendChild(img);
        root.appendChild(titleEl);
        ring.appendChild(root);

        const rec = { root, img, frame, titleEl, aspect: aspects[i], item, opacity: 1 };
        arts.push(rec);

        img.addEventListener("click", () => toggle(rec));
      });
    }

    // ---------- Attenuazione delle opere del cerchio ----------
    function setOpacity(rec, v) {
      rec.img.setAttribute("material", "opacity", v);
      rec.frame.setAttribute("material", "opacity", v);
      rec.titleEl.setAttribute("text", "opacity", v);
      rec.opacity = v;
    }
    function fadeAll(to, ms) {
      const from = arts.map(r => r.opacity), t0 = performance.now();
      (function step(t) {
        const k = Math.min(1, (t - t0) / ms);
        arts.forEach((r, i) => setOpacity(r, from[i] + (to - from[i]) * k));
        if (k < 1) requestAnimationFrame(step);
      })(t0);
    }

    // ---------- Vetrina: sempre frontale davanti all'osservatore ----------
    function showDisplay(rec) {
      const display = $("display");
      const camObj = $("camera").object3D;

      // posizione e direzione REALI dell'osservatore (funziona anche se
      // nel visore si e' spostato fisicamente rispetto al centro)
      const camPos = new THREE_.Vector3(); camObj.getWorldPosition(camPos);
      const fwd = new THREE_.Vector3(); camObj.getWorldDirection(fwd); fwd.negate();
      fwd.y = 0;                                   // ignoro l'inclinazione della testa
      if (fwd.lengthSq() < 1e-6) fwd.set(0, 0, -1);
      fwd.normalize();

      const pos = camPos.clone().add(fwd.multiplyScalar(DISPLAY_DIST));
      pos.y = camPos.y;                            // all'altezza degli occhi

      display.object3D.position.copy(pos);
      // ruota solo attorno a Y perche' il piano guardi esattamente l'osservatore
      display.object3D.rotation.set(
        0, Math.atan2(camPos.x - pos.x, camPos.z - pos.z), 0);

      // dimensioni rispettando le proporzioni originali
      let h = DISPLAY_HEIGHT, w = h * rec.aspect;
      if (w > DISPLAY_MAX_W) { w = DISPLAY_MAX_W; h = w / rec.aspect; }

      clearDisplay();                              // materiale nuovo ogni volta

      const frame = document.createElement("a-plane");
      frame.setAttribute("width", w + 0.06);
      frame.setAttribute("height", h + 0.06);
      frame.setAttribute("position", "0 0 -0.008");
      frame.setAttribute("material", "color: #1c2229; shader: flat; side: double");

      const img = document.createElement("a-plane");
      img.classList.add("closer");
      img.setAttribute("width", w);
      img.setAttribute("height", h);
      img.setAttribute("material",
        `src: ${rec.item.src}; shader: flat; side: double; transparent: true; opacity: 1`);
      img.addEventListener("click", () => deselect());

      const title = document.createElement("a-text");
      title.setAttribute("value", rec.item.title || "");
      title.setAttribute("align", "center");
      title.setAttribute("color", "#f5f2ec");
      title.setAttribute("width", Math.max(w * 0.9, 1.2));
      title.setAttribute("wrap-count", 30);
      title.setAttribute("position", `0 ${-(h / 2 + 0.18)} 0.01`);

      const capW = Math.min(Math.max(w, 1.4), 3.0);
      const cap = document.createElement("a-entity");
      cap.setAttribute("position", `0 ${-(h / 2 + 0.52)} 0.01`);
      const capBg = document.createElement("a-plane");
      capBg.setAttribute("width", capW);
      capBg.setAttribute("height", 0.34);
      capBg.setAttribute("material",
        "color: #101418; shader: flat; opacity: 0.85; transparent: true");
      const capTx = document.createElement("a-text");
      capTx.setAttribute("value", rec.item.caption || "");
      capTx.setAttribute("align", "center");
      capTx.setAttribute("color", "#b9b3a4");
      capTx.setAttribute("width", capW * 0.85);
      capTx.setAttribute("wrap-count", 52);
      capTx.setAttribute("position", "0 0 0.01");
      cap.appendChild(capBg); cap.appendChild(capTx);

      display.appendChild(frame);
      display.appendChild(img);
      display.appendChild(title);
      display.appendChild(cap);

      display.setAttribute("visible", true);
      display.setAttribute("animation__in",
        "property: scale; from: 0.92 0.92 0.92; to: 1 1 1; dur: 260; easing: easeOutQuad");
    }

    // Svuota la vetrina liberando le texture dalla memoria GPU
    function clearDisplay() {
      const display = $("display");
      while (display.firstChild) {
        clearTexture(display.firstChild);
        display.removeChild(display.firstChild);
      }
    }

    // ---------- Selezione / chiusura ----------
    function select(rec) {
      spinning = false;
      showDisplay(rec);
      fadeAll(DIM_OPACITY, 320);
      selected = rec;
    }

    function deselect() {
      if (!selected) return;
      $("display").setAttribute("visible", false);
      clearDisplay();
      fadeAll(1, 320);
      selected = null;
      spinning = true;
    }

    function toggle(rec) {
      if (selected) { deselect(); return; }   // con la vetrina aperta, un gesto la chiude
      select(rec);
    }

    // ---------- Pinch: seleziona l'opera che stai guardando ----------
    function nearestToGaze() {
      const cam = $("camera").object3D;
      const dir = new THREE_.Vector3(); cam.getWorldDirection(dir); dir.negate();
      const camPos = new THREE_.Vector3(); cam.getWorldPosition(camPos);
      let best = null, bestDot = 0.75;    // soglia: ~40 gradi dal centro dello sguardo
      arts.forEach(a => {
        const wp = new THREE_.Vector3(); a.root.object3D.getWorldPosition(wp);
        const d = wp.sub(camPos).normalize().dot(dir);
        if (d > bestDot) { bestDot = d; best = a; }
      });
      return best;
    }
    function onPinch() {
      if (selected) { deselect(); return; }
      const target = nearestToGaze();
      if (target) select(target);
    }
    $("handL").addEventListener("pinchended", onPinch);
    $("handR").addEventListener("pinchended", onPinch);

    // ---------- Tastiera (test da desktop) ----------
    window.addEventListener("keydown", (e) => {
      const ring = $("ring").object3D;
      if (e.key === "ArrowRight") ring.rotation.y -= THREE_.MathUtils.degToRad(10);
      if (e.key === "ArrowLeft")  ring.rotation.y += THREE_.MathUtils.degToRad(10);
      if (e.key === "Escape") deselect();
      if (e.key === "Enter") onPinch();
    });

    // ---------- Avvio ----------
    $("enter").addEventListener("click", () => {
      $("splash").style.display = "none";
      buildRing();
      if (scene.hasLoaded) scene.enterVR();
      else scene.addEventListener("loaded", () => scene.enterVR());
    });
  })();
  </script>
</body>
</html>
